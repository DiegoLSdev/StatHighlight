name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v7.0.1 pinned by SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Lua 5.1 (the version WoW uses)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Check syntax
        run: luac5.1 -p StatHighlight.lua

      - name: Run tests
        run: lua5.1 tests/run.lua
