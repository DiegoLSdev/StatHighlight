name: Release

# Runs only when a version tag is pushed (v1.0.0, v2.0.0, ...)
on:
  push:
    tags:
      - "v*.*.*"

# No permissions by default; granted only to the job that needs them.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to create the Release and upload the zip
    env:
      ADDON: StatHighlight
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1 pinned by SHA (protects against tag changes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check tag and .toc version
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not in vX.Y.Z format"
            exit 1
          fi
          TOC_VERSION=$(grep -E '^## Version:' "$ADDON.toc" | sed -E 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ "v$TOC_VERSION" != "$TAG" ]; then
            echo "::error::Tag ($TAG) does not match '## Version: $TOC_VERSION' in the .toc"
            exit 1
          fi

      - name: Run tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          luac5.1 -p "$ADDON.lua"
          lua5.1 tests/run.lua

      - name: Build zip (StatHighlight/ folder inside)
        run: |
          set -euo pipefail
          mkdir -p "build/$ADDON"
          cp "$ADDON.toc" "$ADDON.lua" README.txt LICENSE "build/$ADDON/"
          cd build
          zip -r -X "../$ADDON-$TAG.zip" "$ADDON"
          cd ..
          echo "Zip contents:"
          unzip -l "$ADDON-$TAG.zip"
          # Check: everything must be inside StatHighlight/ and the .toc must exist
          if unzip -Z1 "$ADDON-$TAG.zip" | grep -v "^$ADDON/"; then
            echo "::error::There are files outside the $ADDON/ folder"
            exit 1
          fi
          unzip -Z1 "$ADDON-$TAG.zip" | grep -qx "$ADDON/$ADDON.toc"
          sha256sum "$ADDON-$TAG.zip" > "$ADDON-$TAG.zip.sha256"
          cat "$ADDON-$TAG.zip.sha256"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$ADDON-$TAG.zip" "$ADDON-$TAG.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ADDON $TAG" \
            --generate-notes \
            --verify-tag
